name: Check TypePHP release

on:
  schedule:
    # 02:00 UTC on day 1, 4, 7, 10, 13, 16, 19, 22, 25 and 28.
    # GitHub cron cannot express "every 72 hours".
    - cron: "0 2 */3 * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Pin a newer TypePHP release
        id: sync
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TYPEPHP_PHP_MINOR: auto
        run: |
          set -euo pipefail
          current="$(grep '^TYPEPHP_VERSION=' versions.env | cut -d= -f2)"
          latest="$(gh api repos/swoole/typephp/releases/latest --jq .tag_name)"
          echo "pinned=${current} latest=${latest}"
          if [[ "${current}" == "${latest}" ]]; then
            echo "updated=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          newest="$(printf '%s\n%s\n' "${current}" "${latest}" | sort -V | tail -1)"
          if [[ "${newest}" != "${latest}" ]]; then
            echo "pinned ${current} is newer than ${latest}; leaving versions.env unchanged"
            echo "updated=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          scripts/sync-release.sh "${latest}"
          git add versions.env
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Update TypePHP pin to ${latest}."
          git push origin HEAD
          echo "updated=true" >> "${GITHUB_OUTPUT}"
          echo "version=${latest}" >> "${GITHUB_OUTPUT}"

      - name: Build and push the image
        if: steps.sync.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run publish-image.yml --ref "${{ github.ref_name }}"

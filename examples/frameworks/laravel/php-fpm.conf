; Laravel FPM 池。请求脚本由前端设置，指向项目的 public/index.php。
; 非 root 启动。以 root 启动时，在 [www] 里加上 user 和 group。
;
;   ./build/laravel-fpm --fpm-config php-fpm.conf
;
; nginx 示例：
;   root /path/to/laravel/public;
;   location / {
;       try_files $uri $uri/ /index.php?$query_string;
;   }
;   location ~ \.php$ {
;       fastcgi_pass 127.0.0.1:9000;
;       fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
;       include fastcgi_params;
;   }

[global]
error_log = /tmp/laravel-fpm.log
pid = /tmp/laravel-fpm.pid
daemonize = no

[www]
listen = 127.0.0.1:9000
listen.allowed_clients = 127.0.0.1
pm = ondemand
pm.max_children = 8
pm.process_idle_timeout = 10s
pm.max_requests = 500
clear_env = no
catch_workers_output = yes
